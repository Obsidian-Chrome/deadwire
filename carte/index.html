<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Deadwire | Carte</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="carte.css" />
  <script defer src="/shared/loader.js"></script>
  <script defer src="/shared/crew-auth.js"></script>
  <script defer src="../app.js"></script>
</head>
<body>

  <main>
    <section class="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__content">
        <section class="pageHero">
          <div class="container">
            <p class="kicker">Carte</p>
            <h1 class="title title--sm">Boissons & cocktails</h1>
            <p class="lead">Tout est pensé pour vous faire découvrir l'ambiance du Deadwire.</p>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="carte-layout">
              <!-- Sommaire fixe sur la gauche -->
              <aside class="carte-sidebar">
                <nav class="carte-nav">
                  <h2 class="carte-nav__title">Sommaire</h2>
                  <a href="#cocktails" class="carte-nav__item">
                    <i class="fa-solid fa-martini-glass-citrus" aria-hidden="true"></i>
                    <span>Cocktails</span>
                  </a>
                  <a href="#mocktails" class="carte-nav__item">
                    <i class="fa-solid fa-glass-water" aria-hidden="true"></i>
                    <span>Mocktails</span>
                  </a>
                  <a href="#habitues" class="carte-nav__item carte-nav__item--members" style="display: none;">
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                    <span>Habitués</span>
                  </a>
                  <a href="#alcools" class="carte-nav__item">
                    <i class="fa-solid fa-whiskey-glass" aria-hidden="true"></i>
                    <span>Alcools</span>
                  </a>
                  <a href="#sans-alcools" class="carte-nav__item">
                    <i class="fa-solid fa-mug-hot" aria-hidden="true"></i>
                    <span>Sans alcools</span>
                  </a>
                </nav>
              </aside>

              <!-- Contenu principal -->
              <div class="carte-content" data-reveal>
                <div id="cocktails" class="menuBlock" data-menu-block="cocktails">
                  <h2 class="sectionTitle">Cocktails</h2>
                </div>

                <div id="mocktails" class="menuBlock" data-menu-block="mocktails">
                  <h2 class="sectionTitle">Mocktails</h2>
                </div>

                <div id="habitues" class="menuBlock menuBlock--members" data-menu-block="habitues" style="display: none;">
                  <h2 class="sectionTitle">Habitués</h2>
                </div>

                <div id="alcools" class="menuBlock" data-menu-block="alcools">
                  <h2 class="sectionTitle">Alcools</h2>
                </div>

                <div id="sans-alcools" class="menuBlock" data-menu-block="sansAlcools">
                  <h2 class="sectionTitle">Sans alcools</h2>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    // Vérifier si l'utilisateur a le rôle membre
    function checkMemberRole() {
      const isMember = localStorage.getItem('discord_is_member');
      const isGM = localStorage.getItem('discord_is_gm');
      return isMember === 'true' || isGM === 'true';
    }

    // Charge menu.json et génère le contenu dynamiquement
    async function loadMenu() {
      try {
        const response = await fetch('menu.json');
        const data = await response.json();
        const isMember = checkMemberRole();
        
        // Fonction pour générer HTML d'un item avec signature
        function renderItemWithSignature(item) {
          const rpButton = (isMember && item.emote) ? `
            <button class="menuItem__rpBtn" 
                    onclick="navigator.clipboard.writeText('${item.emote.replace(/'/g, "\\'")}'); const text = this.querySelector('.rpBtn__text'); const originalText = text.textContent; text.innerHTML = '<i class=\\'fa-solid fa-check\\'></i>'; setTimeout(() => text.textContent = originalText, 1500)"
                    title="Copier l'emote RP">
              <span class="rpBtn__text">Emote</span>
            </button>
          ` : '';
          
          return `
            <div class="menuItem menuItem--withImage">
              ${item.image ? `<img class="menuItem__image" src="${item.image}" alt="${item.name}" onerror="this.style.display='none'" />` : ''}
              <div class="menuItem__content">
                <div class="menuItem__row">
                  <span class="menuItem__name">
                    ${item.name}
                    <span class="menuItem__signature">★ ${item.signature}</span>
                    ${rpButton}
                  </span>
                  <span class="menuItem__price">
                    <span class="priceGil">${item.price}<img class="priceGil__icon" src="../media/gil.webp" alt="Gil" /></span>
                  </span>
                </div>
                <div class="menuItem__desc">${item.description}</div>
              </div>
            </div>
          `;
        }
        
        // Fonction pour générer HTML d'un item simple (sans signature, avec description optionnelle)
        function renderSimpleItem(item) {
          const nameWithDesc = item.description 
            ? `${item.name} <span style="color: rgba(247, 233, 239, 0.5); font-size: 0.9em; font-weight: normal;">(${item.description})</span>`
            : item.name;
          return `
            <div class="menuItem menuItem--withImage">
              ${item.image ? `<img class="menuItem__image" src="${item.image}" alt="${item.name}" onerror="this.style.display='none'" />` : ''}
              <div class="menuItem__content">
                <div class="menuItem__row">
                  <span class="menuItem__name">${nameWithDesc}</span>
                  <span class="menuItem__price"><span class="priceGil">${item.price}<img class="priceGil__icon" src="../media/gil.webp" alt="Gil" /></span></span>
                </div>
              </div>
            </div>
          `;
        }
        
        // Remplir Cocktails
        const cocktailsBlock = document.querySelector('[data-menu-block="cocktails"]');
        if (cocktailsBlock) {
          cocktailsBlock.innerHTML = '<h2 class="sectionTitle">Cocktails</h2>' + 
            data.cocktails.map(renderItemWithSignature).join('');
        }
        
        // Remplir Mocktails
        const mocktailsBlock = document.querySelector('[data-menu-block="mocktails"]');
        if (mocktailsBlock) {
          mocktailsBlock.innerHTML = '<h2 class="sectionTitle">Mocktails</h2>' + 
            data.mocktails.map(renderItemWithSignature).join('');
        }
        
        // Remplir Habitués (visible uniquement pour les membres)
        if (isMember && data.habitues) {
          const habituesBlock = document.querySelector('[data-menu-block="habitues"]');
          const habituesNav = document.querySelector('.carte-nav__item--members');
          
          if (habituesBlock) {
            habituesBlock.style.display = 'block';
            habituesBlock.innerHTML = '<h2 class="sectionTitle">Habitués</h2>' + 
              data.habitues.map(renderItemWithSignature).join('');
          }
          
          if (habituesNav) {
            habituesNav.style.display = 'flex';
          }
        }
        
        // Remplir Alcools
        const alcoholsBlock = document.querySelector('[data-menu-block="alcools"]');
        if (alcoholsBlock) {
          alcoholsBlock.innerHTML = '<h2 class="sectionTitle">Alcools</h2>' + 
            data.alcools.map(renderSimpleItem).join('');
        }
        
        // Remplir Sans Alcools
        const sansAlcoolsBlock = document.querySelector('[data-menu-block="sansAlcools"]');
        if (sansAlcoolsBlock) {
          sansAlcoolsBlock.innerHTML = '<h2 class="sectionTitle">Sans alcools</h2>' + 
            data.sansAlcools.map(renderSimpleItem).join('');
        }
        
      } catch (error) {
        console.error('Erreur chargement menu:', error);
      }
    }
    
    loadMenu();
  </script>
</body>
</html>
