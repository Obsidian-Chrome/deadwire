name: Update Discord Gallery

on:
  schedule:
    # Exécute toutes les 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd galerie
          npm install node-fetch
      
      - name: Fetch Discord gallery images
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1450789959383388285'
        run: |
          cd galerie
          node fetch-discord-gallery.js
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add galerie/gallery.json
          
          # Vérifier s'il y a des changements
          if git diff --staged --quiet; then
            echo "Aucun changement détecté dans gallery.json - Pas de commit nécessaire"
          else
            echo "Changements détectés - Création du commit"
            git commit -m "Update Discord gallery [automated]"
            git push
            echo "Changements poussés avec succès"
          fi
