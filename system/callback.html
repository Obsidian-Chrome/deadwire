<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Discord...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0a1f 0%, #0a000c 50%, #1a0a1f 100%);
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 42, 61, 0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      color: rgba(255, 42, 61, 0.9);
      max-width: 400px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p id="status">Connexion en cours...</p>
  </div>

  <script src="auth.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById('status');

      try {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');

        if (!accessToken) {
          throw new Error('Aucun token d\'accès reçu');
        }

        statusEl.textContent = 'Récupération de vos informations...';

        const success = await window.discordAuth.login(accessToken);

        if (!success) {
          throw new Error('Échec de la connexion');
        }

        statusEl.textContent = 'Connexion réussie ! Redirection...';

        setTimeout(() => {
          window.location.href = '/system/';
        }, 1000);

      } catch (error) {
        console.error('Callback error:', error);
        statusEl.innerHTML = `
          <div class="error">
            <h2>Erreur de connexion</h2>
            <p>${error.message}</p>
            <button onclick="window.location.href='/system/'" 
                    style="margin-top: 20px; padding: 10px 20px; background: rgba(255, 42, 61, 0.2); border: 1px solid rgba(255, 42, 61, 0.5); border-radius: 6px; color: white; cursor: pointer;">
              Retour
            </button>
          </div>
        `;
        document.querySelector('.spinner').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
