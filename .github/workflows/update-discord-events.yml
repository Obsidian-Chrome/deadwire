name: Update Discord Events

on:
  schedule:
    # Exécute toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  update-events:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd programme
          npm install node-fetch
      
      - name: Fetch Discord events
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          cd programme
          node fetch-discord-events.js
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add programme/events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Update Discord events [automated]" && git push)
