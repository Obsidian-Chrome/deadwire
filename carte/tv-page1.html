<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Deadwire | Carte TV - Page 1</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0a1f 0%, #0a000c 50%, #1a0a1f 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .tvMenu {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 25px 45px;
      box-sizing: border-box;
    }

    .tvMenu__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      flex: 1;
      overflow: hidden;
    }

    .tvMenu__column {
      display: flex;
      flex-direction: column;
    }

    .tvMenu__categoryTitle {
      font-size: 1.65rem;
      font-weight: 700;
      color: #FF2A3D;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 12px 0;
      padding-bottom: 7px;
      border-bottom: 2px solid rgba(255, 42, 61, 0.3);
      text-shadow: 0 0 20px rgba(255, 42, 61, 0.5);
    }

    .tvMenu__items {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .tvMenuItem {
      background: rgba(255, 42, 61, 0.03);
      border-left: 3px solid rgba(255, 42, 61, 0.4);
      padding: 9px 13px;
    }

    .tvMenuItem__row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }

    .tvMenuItem__name {
      font-size: 1.6rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.02em;
    }

    .tvMenuItem__signature {
      font-size: 0.75rem;
      color: #FF2A3D;
      margin-left: 6px;
      opacity: 0.8;
    }

    .tvMenuItem__price {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #FFD700;
    }

    .tvMenuItem__price img {
      height: 17px;
      width: auto;
      filter: brightness(1.2);
    }

    .tvMenuItem__desc {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.25;
      font-style: italic;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="tvMenu">
    <div class="tvMenu__grid">
      <div class="tvMenu__column">
        <h2 class="tvMenu__categoryTitle">Cocktails</h2>
        <div class="tvMenu__items" data-category="cocktails"></div>
      </div>

      <div class="tvMenu__column">
        <h2 class="tvMenu__categoryTitle">Mocktails</h2>
        <div class="tvMenu__items" data-category="mocktails"></div>
      </div>
    </div>
  </div>

  <script>
    // Charge menu.json et génère le contenu dynamiquement
    async function loadMenu() {
      try {
        const response = await fetch('menu.json');
        const data = await response.json();
        
        // Remplir Cocktails
        const cocktailsContainer = document.querySelector('[data-category="cocktails"]');
        cocktailsContainer.innerHTML = data.cocktails.map(item => `
          <div class="tvMenuItem">
            <div class="tvMenuItem__row">
              <span class="tvMenuItem__name">${item.name}<span class="tvMenuItem__signature">★ ${item.signature}</span></span>
              <span class="tvMenuItem__price">${item.price}<img src="../media/gil.webp" alt="Gil" /></span>
            </div>
            <div class="tvMenuItem__desc">${item.description}</div>
          </div>
        `).join('');
        
        // Remplir Mocktails
        const mocktailsContainer = document.querySelector('[data-category="mocktails"]');
        mocktailsContainer.innerHTML = data.mocktails.map(item => `
          <div class="tvMenuItem">
            <div class="tvMenuItem__row">
              <span class="tvMenuItem__name">${item.name}<span class="tvMenuItem__signature">★ ${item.signature}</span></span>
              <span class="tvMenuItem__price">${item.price}<img src="../media/gil.webp" alt="Gil" /></span>
            </div>
            <div class="tvMenuItem__desc">${item.description}</div>
          </div>
        `).join('');
        
      } catch (error) {
        console.error('Erreur chargement menu:', error);
      }
    }
    
    loadMenu();
  </script>
</body>
</html>
