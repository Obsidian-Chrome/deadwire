<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Visualizer | Le Deadwire</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="../styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.175.0"
      }
    }
  </script>
  <script defer src="../radio.js"></script>
  <script type="module" src="visualizer.js"></script>
</head>
<body class="visualizerPage">
  <div class="visualizerFullscreen" data-visualizer-container>
    <div class="visualizerStartOverlay" data-start-overlay>
      <div class="visualizerStartHint">
        <span>Cliquez pour démarrer</span>
      </div>
    </div>
    
    <div class="visualizerLogo">
      <img src="../media/Deadwire_Txt.png" alt="Deadwire" />
    </div>
    
    <div class="visualizerCanvas">
      <canvas id="audioVisualizer" data-visualizer></canvas>
    </div>
    
    <div class="visualizerTrackInfo" data-visualizer-track>
      <span class="visualizerTrackInfo__text"></span>
    </div>
  </div>

  <!-- Radio controls cachés mais nécessaires pour radio.js -->
  <div style="display: none;">
    <div class="radioBar" data-radio-bar>
      <button class="radioBar__toggle" data-radio-toggle></button>
      <button class="radioBar__play" data-radio-play></button>
      <div class="radioBar__info">
        <span class="radioBar__track" data-radio-title>Radio Deadwire</span>
      </div>
      <div class="radioBar__volume">
        <input type="range" min="0" max="1" step="0.01" value="0.2" data-radio-volume />
      </div>
    </div>
  </div>
</body>
</html>
