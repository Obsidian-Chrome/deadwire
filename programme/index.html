<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Deadwire | Programme</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles.css" />
  <script defer src="/shared/loader.js"></script>
  <script defer src="/shared/crew-auth.js"></script>
  <script defer src="../app.js"></script>
  <script defer src="discord-events.js"></script>
</head>
<body>

  <main>
    <section class="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__content">
        <section class="pageHero">
          <div class="container">
            <p class="kicker">Programme</p>
            <h1 class="title title--sm">Événements & nuits spéciales</h1>
            <p class="lead">Prévoyez vos sorties grâce au programme. De la synthwave au drum & bass.</p>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div id="eventsGrid" class="events-grid" data-reveal>
              <!-- Les événements seront injectés ici par JS -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
              <i class="fa-solid fa-calendar-xmark" aria-hidden="true"></i>
              <h2>Aucun événement prévu</h2>
              <p>Revenez bientôt pour découvrir nos prochaines soirées !</p>
            </div>
          </div>
        </section>

        <style>
          .events-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 48px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
          }

          .event-card {
            background: rgba(10, 0, 12, 0.6);
            border: 1px solid rgba(255, 42, 61, 0.2);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
          }

          @media (min-width: 768px) {
            .event-card {
              flex-direction: row;
            }
          }

          .event-card:hover {
            border-color: rgba(255, 42, 61, 0.5);
            box-shadow: 0 8px 24px rgba(255, 42, 61, 0.25);
            transform: translateX(4px);
          }

          .event-card__banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, rgba(255, 42, 61, 0.1) 0%, rgba(10, 0, 12, 0.8) 100%);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
          }

          @media (min-width: 768px) {
            .event-card__banner {
              width: 320px;
              height: auto;
              min-height: 160px;
            }
          }

          .event-card__banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
          }

          .event-card__content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
          }

          .event-card__title {
            font-size: 1.35rem;
            font-weight: 600;
            color: rgba(247, 233, 239, 0.95);
            margin: 0 0 14px 0;
            line-height: 1.3;
          }

          .event-card__meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
            color: rgba(247, 233, 239, 0.7);
          }

          .event-card__meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .event-card__meta-item i {
            color: rgba(255, 42, 61, 0.8);
            width: 18px;
            text-align: center;
            font-size: 1rem;
          }

          .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(247, 233, 239, 0.6);
          }

          .empty-state i {
            font-size: 4rem;
            color: rgba(255, 42, 61, 0.3);
            margin-bottom: 24px;
          }

          .empty-state h2 {
            font-size: 1.75rem;
            color: rgba(247, 233, 239, 0.8);
            margin: 0 0 12px 0;
          }

          .empty-state p {
            font-size: 1.1rem;
            margin: 0;
          }
        </style>
      </div>
    </section>
  </main>
</body>
</html>
