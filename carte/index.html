<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Deadwire | Carte</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="carte.css" />
  <script defer src="/shared/loader.js"></script>
  <script defer src="/shared/crew-auth.js"></script>
  <script defer src="../app.js"></script>
</head>
<body>

  <main>
    <section class="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__content">
        <section class="pageHero">
          <div class="container">
            <p class="kicker">Carte</p>
            <h1 class="title title--sm">Boissons & cocktails</h1>
            <p class="lead">Tout est pensé pour vous faire découvrir l'ambiance du Deadwire.</p>
          </div>
        </section>

        <section class="section">
      <div class="container">
        <div class="menuGrid" data-reveal>
          <div class="menuBlock" data-menu-block="cocktails">
            <h2 class="sectionTitle">Cocktails</h2>
          </div>

          <div class="menuBlock" data-menu-block="mocktails">
            <h2 class="sectionTitle">Mocktails</h2>
          </div>

          <div class="menuBlock" data-menu-block="alcools">
            <h2 class="sectionTitle">Alcools</h2>
          </div>

          <div class="menuBlock" data-menu-block="sansAlcools">
            <h2 class="sectionTitle">Sans alcools</h2>
          </div>
        </div>
      </div>
    </section>
      </div>
    </section>
  </main>

  <script>
    // Charge menu.json et génère le contenu dynamiquement
    async function loadMenu() {
      try {
        const response = await fetch('menu.json');
        const data = await response.json();
        
        // Fonction pour générer HTML d'un item avec signature
        function renderItemWithSignature(item) {
          const imageUrl = item.image || '../media/carte/default.png';
          return `
            <div class="menuItem menuItem--withImage">
              <img class="menuItem__image" src="${imageUrl}" alt="${item.name}" onerror="this.style.display='none'" />
              <div class="menuItem__content">
                <div class="menuItem__row">
                  <span class="menuItem__name">${item.name}<span class="menuItem__signature">★ ${item.signature}</span></span>
                  <span class="menuItem__price"><span class="priceGil">${item.price}<img class="priceGil__icon" src="../media/gil.webp" alt="Gil" /></span></span>
                </div>
                <div class="menuItem__desc">${item.description}</div>
              </div>
            </div>
          `;
        }
        
        // Fonction pour générer HTML d'un item simple (sans signature, avec description optionnelle)
        function renderSimpleItem(item) {
          const imageUrl = item.image || '../media/menu/default.png';
          const nameWithDesc = item.description 
            ? `${item.name} <span style="color: rgba(247, 233, 239, 0.5); font-size: 0.9em; font-weight: normal;">(${item.description})</span>`
            : item.name;
          return `
            <div class="menuItem menuItem--withImage">
              <img class="menuItem__image" src="${imageUrl}" alt="${item.name}" onerror="this.style.display='none'" />
              <div class="menuItem__content">
                <div class="menuItem__row">
                  <span class="menuItem__name">${nameWithDesc}</span>
                  <span class="menuItem__price"><span class="priceGil">${item.price}<img class="priceGil__icon" src="../media/gil.webp" alt="Gil" /></span></span>
                </div>
              </div>
            </div>
          `;
        }
        
        // Remplir Cocktails
        const cocktailsBlock = document.querySelector('[data-menu-block="cocktails"]');
        if (cocktailsBlock) {
          cocktailsBlock.innerHTML = '<h2 class="sectionTitle">Cocktails</h2>' + 
            data.cocktails.map(renderItemWithSignature).join('');
        }
        
        // Remplir Mocktails
        const mocktailsBlock = document.querySelector('[data-menu-block="mocktails"]');
        if (mocktailsBlock) {
          mocktailsBlock.innerHTML = '<h2 class="sectionTitle">Mocktails</h2>' + 
            data.mocktails.map(renderItemWithSignature).join('');
        }
        
        // Remplir Alcools
        const alcoholsBlock = document.querySelector('[data-menu-block="alcools"]');
        if (alcoholsBlock) {
          alcoholsBlock.innerHTML = '<h2 class="sectionTitle">Alcools</h2>' + 
            data.alcools.map(renderSimpleItem).join('');
        }
        
        // Remplir Sans Alcools
        const sansAlcoolsBlock = document.querySelector('[data-menu-block="sansAlcools"]');
        if (sansAlcoolsBlock) {
          sansAlcoolsBlock.innerHTML = '<h2 class="sectionTitle">Sans alcools</h2>' + 
            data.sansAlcools.map(renderSimpleItem).join('');
        }
        
      } catch (error) {
        console.error('Erreur chargement menu:', error);
      }
    }
    
    loadMenu();
  </script>
</body>
</html>
