<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Deadwire | Galerie</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles.css" />
  <script defer src="/shared/loader.js"></script>
  <script defer src="/shared/crew-auth.js"></script>
  <script defer src="../app.js"></script>
  <script defer src="gallery.js"></script>
</head>
<body>

  <main>
    <section class="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__content">
        <section class="pageHero">
          <div class="container">
            <p class="kicker">Galerie</p>
            <h1 class="title title--sm">Nos soirées en images</h1>
            <p class="lead">Revivez l'ambiance du Deadwire à travers nos photos et vidéos.</p>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div id="galleryGrid" class="gallery-grid" data-reveal>
              <!-- Les médias seront injectés ici par JS -->
            </div>

            <div id="loadingState" class="loading-state" style="display: none;">
              <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
              <p>Chargement des images...</p>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
              <i class="fa-solid fa-images" aria-hidden="true"></i>
              <h2>Aucune image disponible</h2>
              <p>Revenez bientôt pour découvrir nos photos !</p>
            </div>
          </div>
        </section>

        <style>
          .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
          }

          @media (min-width: 768px) {
            .gallery-grid {
              grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            }
          }

          .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: rgba(10, 0, 12, 0.6);
            border: 1px solid rgba(255, 42, 61, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 16 / 9;
          }

          .gallery-item:hover {
            border-color: rgba(255, 42, 61, 0.5);
            box-shadow: 0 8px 24px rgba(255, 42, 61, 0.25);
            transform: translateY(-4px);
          }

          .gallery-item img,
          .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
          }

          .gallery-item__overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
          }

          .gallery-item:hover .gallery-item__overlay {
            opacity: 1;
          }

          .gallery-item__author {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(247, 233, 239, 0.95);
            font-size: 0.8rem;
            white-space: nowrap;
          }

          .gallery-item__author i {
            font-size: 0.9rem;
            color: rgba(255, 42, 61, 0.8);
          }

          .gallery-item__video-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 42, 61, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            pointer-events: none;
            transition: all 0.3s ease;
          }

          .gallery-item:hover .gallery-item__video-icon {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 42, 61, 1);
          }

          .loading-state,
          .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(247, 233, 239, 0.6);
          }

          .loading-state i,
          .empty-state i {
            font-size: 4rem;
            color: rgba(255, 42, 61, 0.3);
            margin-bottom: 24px;
          }

          .loading-state h2,
          .empty-state h2 {
            font-size: 1.75rem;
            color: rgba(247, 233, 239, 0.8);
            margin: 0 0 12px 0;
          }

          .loading-state p,
          .empty-state p {
            font-size: 1.1rem;
            margin: 0;
          }

          /* Modal lightbox */
          .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
          }

          .lightbox.active {
            display: flex;
          }

          .lightbox__content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
          }

          .lightbox__content img,
          .lightbox__content video {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
          }

          .lightbox__close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 42, 61, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100001;
          }

          .lightbox__close:hover {
            background: rgba(255, 42, 61, 1);
            transform: scale(1.1);
          }

          .lightbox__nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 42, 61, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
          }

          .lightbox__nav:hover {
            background: rgba(255, 42, 61, 1);
            transform: translateY(-50%) scale(1.1);
          }

          .lightbox__nav--prev {
            left: 20px;
          }

          .lightbox__nav--next {
            right: 20px;
          }

          @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
          }
        </style>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <button id="lightboxClose" class="lightbox__close" aria-label="Fermer">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button id="lightboxPrev" class="lightbox__nav lightbox__nav--prev" aria-label="Précédent">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button id="lightboxNext" class="lightbox__nav lightbox__nav--next" aria-label="Suivant">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <div id="lightboxContent" class="lightbox__content"></div>
  </div>

</body>
</html>
