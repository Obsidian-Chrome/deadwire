<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV | Le Deadwire</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0a1f 0%, #0a000c 50%, #1a0a1f 100%);
    }

    .tvPage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tvPage__video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="tvPage">
    <video 
      class="tvPage__video" 
      autoplay 
      loop
      muted 
      playsinline
      data-tv-video
    >
      <source src="../media/visualizer/pubs.webm" type="video/webm">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

  <script>
    const video = document.querySelector('[data-tv-video]');
    
    if (video) {
      video.addEventListener('loadedmetadata', () => {
        synchronizeVideo();
      });

      // Fonction de synchronisation basée sur l'heure UTC
      function synchronizeVideo() {
        const now = Date.now();
        const videoDuration = video.duration;
        
        if (!videoDuration || videoDuration === 0) {
          console.warn('Durée vidéo non disponible, réessai...');
          setTimeout(synchronizeVideo, 100);
          return;
        }

        const currentTimeInSeconds = (now / 1000) % videoDuration;
        
        video.currentTime = currentTimeInSeconds;
        
        console.log(`TV synchronisée: ${currentTimeInSeconds.toFixed(2)}s / ${videoDuration.toFixed(2)}s`);
      }

      setInterval(() => {
        if (video.duration) {
          const now = Date.now();
          const expectedTime = (now / 1000) % video.duration;
          const drift = Math.abs(video.currentTime - expectedTime);
          
          if (drift > 1.0) {
            console.log(`Correction de dérive: ${drift.toFixed(2)}s`);
            video.currentTime = expectedTime;
          }
        }
      }, 10000);
      video.play().catch(err => {
        console.log('Autoplay bloqué, tentative au premier clic');
        
        document.addEventListener('click', () => {
          video.play();
        }, { once: true });
      });

      video.addEventListener('pause', () => {
        video.play();
      });
    }
  </script>
</body>
</html>
