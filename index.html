<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Deadwire | Accueil</title>
  <link rel="icon" href="media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="/shared/loader.js"></script>
  <script defer src="/shared/crew-auth.js"></script>
  <script defer src="app.js"></script>
</head>
<body>

  <main>
    <section class="cover">
      <div class="cover__bg" aria-hidden="true"></div>
      <div class="container cover__inner">
        <img class="cover__logo" src="media/Deadwire_Txt.png" alt="Le Deadwire" />
        <p class="cover__tagline">Bar - Concerts</p>

        <div class="cover__actions">
          <a class="btn btn--primary" href="/carte">Voir la carte</a>
          <a class="btn btn--ghost" href="/programme">Programme</a>
        </div>

        <div class="locationBlock" data-reveal>
          <div class="locationBlock__map">
            <div class="locationBlock__mapInner"></div>
            <div class="locationBlock__grid"></div>
            <div class="locationBlock__pin"></div>
            <div class="locationBlock__beacon"></div>
          </div>
          
          <div class="locationBlock__content">
            <div class="locationCard">
              <div class="locationCard__icon">
                <i class="fa-regular fa-clock" aria-hidden="true"></i>
              </div>
              <div class="locationCard__body">
                <div class="locationCard__label">Horaires</div>
                <div class="locationCard__value">Lundi - 21h00 à 23h00</div>
              </div>
            </div>

            <div class="locationCard">
              <div class="locationCard__icon">
                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
              </div>
              <div class="locationCard__body">
                <div class="locationCard__label">Adresse</div>
                <div class="locationCard__address">
                  <span class="locationCard__badge locationCard__badge--hrp">HRP</span>
                  <span>La Coupe 2 - 6 [Ragnarok]</span>
                </div>
                <div class="locationCard__address">
                  <span class="locationCard__badge locationCard__badge--rp">RP</span>
                  <span>S9 - Zone Récréative</span>
                </div>
              </div>
            </div>

            <div class="locationCard">
              <div class="locationCard__icon">
                <i class="fa-solid fa-snowflake" aria-hidden="true"></i>
              </div>
              <div class="locationCard__body">
                <div class="locationCard__label">Snowcloak</div>
                <div class="locationCard__value" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                  <div style="display: flex; align-items: center; gap: 8px; position: relative;">
                    <span style="font-size: 0.85rem; color: rgba(247, 233, 239, 0.6); min-width: 40px;">ID :</span>
                    <code onclick="navigator.clipboard.writeText('SNOW-CR9XJTMF36'); this.style.background='rgba(255, 42, 61, 0.3)'; setTimeout(() => this.style.background='rgba(255, 42, 61, 0.1)', 200); const indicator = this.nextElementSibling; indicator.style.opacity='1'; setTimeout(() => indicator.style.opacity='0', 1500)" style="flex: 1; padding: 8px 12px; background: rgba(255, 42, 61, 0.1); border: 1px solid rgba(255, 42, 61, 0.3); border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.9rem; color: rgba(247, 233, 239, 0.9); cursor: pointer; transition: all 0.2s; user-select: all;" onmouseover="this.style.borderColor='rgba(255, 42, 61, 0.5)'" onmouseout="this.style.borderColor='rgba(255, 42, 61, 0.3)'">SNOW-CR9XJTMF36</code>
                    <span style="position: absolute; right: -70px; font-size: 0.8rem; color: rgba(255, 42, 61, 0.9); opacity: 0; transition: opacity 0.3s; pointer-events: none;">✓ Copié !</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px; position: relative;">
                    <span style="font-size: 0.85rem; color: rgba(247, 233, 239, 0.6); min-width: 40px;">MDP :</span>
                    <code onclick="navigator.clipboard.writeText('TH3D34DW1R3'); this.style.background='rgba(255, 42, 61, 0.3)'; setTimeout(() => this.style.background='rgba(255, 42, 61, 0.1)', 200); const indicator = this.nextElementSibling; indicator.style.opacity='1'; setTimeout(() => indicator.style.opacity='0', 1500)" style="flex: 1; padding: 8px 12px; background: rgba(255, 42, 61, 0.1); border: 1px solid rgba(255, 42, 61, 0.3); border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.9rem; color: rgba(247, 233, 239, 0.9); cursor: pointer; transition: all 0.2s; user-select: all;" onmouseover="this.style.borderColor='rgba(255, 42, 61, 0.5)'" onmouseout="this.style.borderColor='rgba(255, 42, 61, 0.3)'">TH3D34DW1R3</code>
                    <span style="position: absolute; right: -70px; font-size: 0.8rem; color: rgba(255, 42, 61, 0.9); opacity: 0; transition: opacity 0.3s; pointer-events: none;">✓ Copié !</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="carousel" data-carousel>
          <div class="carousel__track" data-carousel-track>
            <div class="carousel__slide">
              <a href="#" data-lightbox aria-label="Ouvrir l'image 01">
                <img src="media/deadwire_1.png" alt="Image 01" />
              </a>
            </div>
            <div class="carousel__slide">
              <a href="#" data-lightbox aria-label="Ouvrir l'image 02">
                <img src="media/deadwire_2.png" alt="Image 02" />
              </a>
            </div>
            <div class="carousel__slide">
              <a href="#" data-lightbox aria-label="Ouvrir l'image 03">
                <img src="media/deadwire_3.png" alt="Image 03" />
              </a>
            </div>
            <div class="carousel__slide">
              <a href="#" data-lightbox aria-label="Ouvrir l'image 04">
                <img src="media/deadwire_4.png" alt="Image 04" />
              </a>
            </div>
            <div class="carousel__slide">
              <a href="#" data-lightbox aria-label="Ouvrir l'image 05">
                <img src="media/deadwire_5.png" alt="Image 05" />
              </a>
            </div>
          </div>
          <button class="carousel__btn carousel__btn--prev" data-carousel-prev aria-label="Image précédente">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>
          <button class="carousel__btn carousel__btn--next" data-carousel-next aria-label="Image suivante">
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
          </button>
          <div class="carousel__dots" data-carousel-dots></div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
