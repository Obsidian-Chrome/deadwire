<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV | Le Deadwire</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0a1f 0%, #0a000c 50%, #1a0a1f 100%);
    }

    .tvPage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tvPage__video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="tvPage">
    <video 
      class="tvPage__video" 
      autoplay 
      muted 
      playsinline
      data-tv-video
    >
      <source src="" type="video/webm" data-video-source>
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

  <script>
    const video = document.querySelector('[data-tv-video]');
    const videoSource = document.querySelector('[data-video-source]');
    
    // Configuration du cycle de vidéos
    const videos = [
      {
        name: 'Pub',
        url: 'https://github.com/Obsidian-Chrome/deadwire/releases/download/media-v1.0/pubs.webm',
        duration: 412 // 6:52
      },
      {
        name: 'News',
        url: '../media/visualizer/news_brute.webm',
        duration: 34 // 0:34
      }
    ];
    
    const totalCycleDuration = videos.reduce((sum, v) => sum + v.duration, 0); // 446s (7:26)
    let currentVideoIndex = -1;
    let isTransitioning = false;
    
    if (video && videoSource) {
      // Détermine quelle vidéo afficher en fonction de l'heure UTC
      function getVideoAtCurrentTime() {
        const now = Date.now();
        const cyclePosition = (now / 1000) % totalCycleDuration;
        
        let accumulatedTime = 0;
        for (let i = 0; i < videos.length; i++) {
          if (cyclePosition < accumulatedTime + videos[i].duration) {
            const timeInVideo = cyclePosition - accumulatedTime;
            return { index: i, timeInVideo };
          }
          accumulatedTime += videos[i].duration;
        }
        
        return { index: 0, timeInVideo: 0 };
      }
      
      // Change de vidéo si nécessaire
      function switchVideoIfNeeded() {
        const { index, timeInVideo } = getVideoAtCurrentTime();
        
        if (index !== currentVideoIndex && !isTransitioning) {
          isTransitioning = true;
          currentVideoIndex = index;
          
          console.log(`Changement vers: ${videos[index].name}`);
          
          videoSource.src = videos[index].url;
          video.load();
          
          video.addEventListener('loadeddata', () => {
            video.currentTime = timeInVideo;
            video.play().then(() => {
              isTransitioning = false;
              console.log(`${videos[index].name} synchronisée: ${timeInVideo.toFixed(2)}s / ${videos[index].duration}s`);
            }).catch(err => {
              console.error('Erreur play:', err);
              isTransitioning = false;
            });
          }, { once: true });
        }
      }
      
      // Fonction de synchronisation
      function synchronizeVideo() {
        const { index, timeInVideo } = getVideoAtCurrentTime();
        
        if (index === currentVideoIndex && video.duration) {
          const drift = Math.abs(video.currentTime - timeInVideo);
          
          if (drift > 1.0) {
            console.log(`Correction de dérive: ${drift.toFixed(2)}s`);
            video.currentTime = timeInVideo;
          }
        } else {
          switchVideoIfNeeded();
        }
      }
      
      // Initialisation
      switchVideoIfNeeded();
      
      // Vérification toutes les secondes pour changement de vidéo
      setInterval(switchVideoIfNeeded, 1000);
      
      // Correction de dérive toutes les 10 secondes
      setInterval(synchronizeVideo, 10000);
      
      // Gestion de l'autoplay bloqué
      video.addEventListener('pause', () => {
        if (!isTransitioning) {
          video.play().catch(() => {
            console.log('Autoplay bloqué, clic requis');
            document.addEventListener('click', () => {
              video.play();
            }, { once: true });
          });
        }
      });
      
      // Détecte la fin de vidéo pour switcher immédiatement
      video.addEventListener('ended', () => {
        switchVideoIfNeeded();
      });
    }
  </script>
</body>
</html>
