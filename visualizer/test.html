<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizer Test | Le Deadwire</title>
  <link rel="icon" href="../media/Deadwire_Logo_Neon.png" type="image/png" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0a1f 0%, #0a000c 50%, #1a0a1f 100%);
    }

    .visualizerTest {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .visualizerTest__video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

  </style>
</head>
<body>
  <div class="visualizerTest">
    <video 
      class="visualizerTest__video" 
      autoplay 
      loop 
      muted
      playsinline
      data-visualizer-video
    >
      <source src="../media/visualizer/visualizer_test.webm" type="video/webm">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

  <script>
    // Assure que la vidéo démarre
    const video = document.querySelector('[data-visualizer-video]');
    
    if (video) {
      // Tente de jouer dès que possible
      video.play().catch(err => {
        console.log('Autoplay bloqué, tentative au premier clic');
        
        // Fallback : joue au premier clic si autoplay bloqué
        document.addEventListener('click', () => {
          video.play();
        }, { once: true });
      });

      // Assure que la vidéo reste en lecture
      video.addEventListener('pause', () => {
        video.play();
      });
    }
  </script>
</body>
</html>
