  <script>
    (async () => {
      const protectedContent = document.getElementById('protected-content');
      
      // Vérification rapide depuis le cache localStorage
      const cachedToken = localStorage.getItem('discord_token');
      const cachedExpiry = localStorage.getItem('discord_token_expiry');
      const cachedIsMember = localStorage.getItem('discord_is_member') === 'true';
      const cachedIsGM = localStorage.getItem('discord_is_gm') === 'true';
      
      // Si cache valide et utilisateur autorisé, afficher immédiatement
      if (cachedToken && cachedExpiry && Date.now() < parseInt(cachedExpiry) && (cachedIsMember || cachedIsGM)) {
        if (protectedContent) protectedContent.style.display = 'block';
      }
      
      // Attendre que auth.js soit chargé
      function waitForAuth() {
        return new Promise((resolve) => {
          if (window.discordAuth) {
            resolve();
          } else {
            const checkInterval = setInterval(() => {
              if (window.discordAuth) {
                clearInterval(checkInterval);
                resolve();
              }
            }, 50); // Réduit de 100ms à 50ms
          }
        });
      }
      
      async function checkAccess() {
        await waitForAuth();
        
        const isAuthenticated = await window.discordAuth.restoreSession();
        
        if (isAuthenticated) {
          const isMember = window.discordAuth.isMember;
          const isGM = window.discordAuth.isGM;
          
          if (isMember || isGM) {
            // Afficher le contenu (déjà affiché si cache valide)
            if (protectedContent) protectedContent.style.display = 'block';
          } else {
            // Accès refusé - rediriger vers crew
            window.location.href = '/crew/';
          }
        } else {
          // Non authentifié - rediriger vers Discord OAuth
          window.location.href = window.discordAuth.getAuthUrl();
        }
      }
      
      await checkAccess();
    })();
  </script>
